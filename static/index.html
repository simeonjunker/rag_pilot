<!DOCTYPE html>
<html lang="en">

<head>
    <title>RAG Chatbot</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 2rem auto;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 1rem;
            height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        form {
            display: flex;
            margin-top: 1rem;
        }

        input {
            flex: 1;
            padding: 0.5rem;
        }

        button {
            padding: 0.5rem 1rem;
        }

        .user {
            color: #0057b7;
            font-weight: bold;
        }

        .bot {
            color: #333;
        }
    </style>
</head>

<body>
    <div id="chat"></div>
    <form id="form">
        <input id="question" type="text" placeholder="Ask something..." autocomplete="off" required>
        <button type="submit">Send</button>
    </form>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("form");
        const input = document.getElementById("question");

        // Neue Thread-ID beim Laden der Seite erzeugen
        const threadId = crypto.randomUUID();

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            chat.innerHTML += `<div class="user">You: ${question}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const botLine = document.createElement("div");
            botLine.className = "bot";
            botLine.textContent = "Bot: ";
            chat.appendChild(botLine);

            const response = await fetch(`/chat?question=${encodeURIComponent(question)}&thread_id=${threadId}`);
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                botLine.textContent += decoder.decode(value, { stream: true });
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>

</html>
